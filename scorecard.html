<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scorecard - Flynn Invitational 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 850: '#063826', 900: '#032519', 950: '#01170f' },
                        gold: { 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' }
                    },
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #01170f; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .gold-gradient-text { background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Traditional Golf Score Indicators */
        .golf-score-eagle {
            border: 2px double #facc15;
            border-radius: 9999px;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #facc15;
            font-weight: 800;
        }
        .golf-score-birdie {
            border: 1.5px solid #facc15;
            border-radius: 9999px;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #facc15;
            font-weight: 700;
        }
        .golf-score-par {
            font-weight: 700;
            color: #ffffff;
        }
        .golf-score-bogey {
            border: 1.5px solid #ef4444;
            border-radius: 2px;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fca5a5;
            font-weight: 700;
        }
        .golf-score-doublebogey {
            border: 2px double #ef4444;
            border-radius: 2px;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fca5a5;
            font-weight: 800;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full min-h-screen flex flex-col bg-emerald-950 shadow-2xl relative border-x border-emerald-900/50">
        
        <!-- Header & Navigation Bar -->
        <header class="bg-gradient-to-b from-emerald-900 to-emerald-950 p-4 border-b border-gold-500/30 text-center relative overflow-hidden sticky top-0 z-30 shadow-lg">
            <div class="relative z-10 flex flex-col items-center">
                <h1 class="font-serif text-2xl font-extrabold tracking-wider gold-gradient-text">FLYNN INVITATIONAL</h1>
                <span id="room-code-badge" class="text-[10px] bg-gold-500/20 text-gold-400 px-2 py-0.5 rounded border border-gold-500/40 font-mono font-bold mt-1">ROOM: FLYNN26</span>
            </div>

            <nav class="flex mt-3 bg-emerald-900/80 p-1 rounded-xl border border-gold-500/20 text-xs font-medium">
                <a id="nav-leaderboard" href="index.html" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-1 text-emerald-200 hover:text-white">
                    <i data-lucide="trophy" class="w-3.5 h-3.5"></i>
                    <span>Leaderboard</span>
                </a>
                <a id="nav-scorecard" href="scorecard.html" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-1 bg-gold-500 text-emerald-950 font-bold shadow-md">
                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                    <span>Scorecard</span>
                </a>
                <a id="nav-setup" href="setup.html" class="flex-1 py-2 rounded-lg flex items-center justify-center gap-1 text-emerald-200 hover:text-white">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                    <span>Setup</span>
                </a>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-4 pb-20 space-y-4">
            
            <!-- Prominent Team Selector -->
            <div class="bg-emerald-900/80 p-3.5 rounded-2xl border-2 border-gold-500/60 flex items-center justify-between gap-3 shadow-xl">
                <div class="flex-1">
                    <label class="text-[11px] uppercase tracking-wider font-extrabold text-gold-400 block mb-1">SCORING FOR TEAM</label>
                    <select id="scorecard-team-select" class="w-full bg-emerald-950 border border-gold-500/40 text-gold-300 font-serif font-black text-lg rounded-xl p-2 outline-none focus:ring-2 focus:ring-gold-400 shadow-inner"></select>
                </div>
                <div class="text-right flex-shrink-0 border-l border-emerald-800 pl-3">
                    <div class="text-[10px] text-emerald-300 uppercase font-bold">Total Score</div>
                    <div id="scorecard-team-total" class="font-black text-2xl text-gold-400">E</div>
                </div>
            </div>

            <!-- Authentic Traditional Golf Scorecard Grid -->
            <div class="bg-emerald-900/90 rounded-2xl border border-gold-500/30 p-3 shadow-xl space-y-2 overflow-hidden">
                <div class="flex justify-between items-center px-1">
                    <span class="text-[10px] font-bold text-gold-400 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="table" class="w-3.5 h-3.5"></i> Full Course Scorecard Grid
                    </span>
                    <span class="text-[9px] text-emerald-300 italic">Scroll horizontally &rarr;</span>
                </div>
                <div class="overflow-x-auto no-scrollbar border border-emerald-800 rounded-xl bg-emerald-950">
                    <table class="w-full text-center text-xs border-collapse min-w-max">
                        <thead>
                            <tr class="bg-emerald-900/80 text-emerald-300 text-[10px] uppercase font-bold border-b border-emerald-800">
                                <th class="p-2 border-r border-emerald-800 text-left sticky left-0 bg-emerald-900 z-10 w-16">Hole</th>
                                <tbody id="scorecard-grid-header-holes" class="contents"></tbody>
                                <th class="p-2 border-l border-emerald-800 bg-emerald-900 text-gold-400">TOT</th>
                            </tr>
                            <tr class="bg-emerald-950/80 text-emerald-400 text-[10px] border-b border-emerald-800/60">
                                <th class="p-1 border-r border-emerald-800 text-left sticky left-0 bg-emerald-950 z-10">Par</th>
                                <tbody id="scorecard-grid-pars" class="contents"></tbody>
                                <th id="scorecard-grid-total-par" class="p-1 border-l border-emerald-800 font-bold">72</th>
                            </tr>
                        </thead>
                        <tbody id="scorecard-grid-team-scores"></tbody>
                    </table>
                </div>
            </div>

            <!-- Hole Selector Navigation -->
            <div class="bg-emerald-900/80 rounded-xl p-2 border border-gold-500/20 shadow-md space-y-2">
                <div class="flex items-center justify-between px-2">
                    <button id="btn-prev-hole" class="p-2 rounded-lg bg-emerald-800 text-gold-400 font-bold"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <div class="text-center">
                        <span id="course-name-display" class="text-[10px] uppercase text-emerald-300 font-semibold tracking-wider">Course Name</span>
                        <div id="current-hole-heading" class="font-serif font-bold text-xl text-gold-400">Hole 1</div>
                    </div>
                    <button id="btn-next-hole" class="p-2 rounded-lg bg-emerald-800 text-gold-400 font-bold"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                </div>

                <div id="hole-pills-container" class="flex gap-1.5 overflow-x-auto pb-1 pt-1 no-scrollbar px-1"></div>
            </div>

            <!-- Active Hole Scoring Panel -->
            <div class="bg-gradient-to-br from-emerald-900 via-emerald-900 to-emerald-950 p-4 rounded-2xl border border-gold-500/30 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-emerald-800/80 pb-3">
                    <div>
                        <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">Hole Info</span>
                        <h2 id="card-hole-title" class="text-2xl font-serif font-bold text-white">Hole 1</h2>
                    </div>
                    <div class="flex gap-3 text-right">
                        <div>
                            <span class="text-[9px] uppercase text-emerald-400 block font-bold">Par</span>
                            <span id="card-hole-par" class="text-lg font-bold text-gold-400">4</span>
                        </div>
                        <div>
                            <span class="text-[9px] uppercase text-emerald-400 block font-bold">White Yards</span>
                            <span id="card-hole-yards" class="text-lg font-bold text-emerald-200">385</span>
                        </div>
                    </div>
                </div>

                <!-- Score Stepper -->
                <div id="team-score-stepper-box" class="bg-emerald-950/90 p-3.5 rounded-xl border border-emerald-800 flex items-center justify-between">
                    <div>
                        <div id="team-score-title" class="text-xs font-bold text-white">Team Scramble Score</div>
                        <div id="team-score-subtitle" class="text-[10px] text-emerald-400">Total strokes taken</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button id="btn-score-minus" class="w-10 h-10 rounded-lg bg-emerald-800 text-gold-400 font-bold text-xl flex items-center justify-center border border-emerald-700">-</button>
                        <span id="current-hole-score-display" class="font-bold text-2xl text-white w-8 text-center">0</span>
                        <button id="btn-score-plus" class="w-10 h-10 rounded-lg bg-emerald-800 text-gold-400 font-bold text-xl flex items-center justify-center border border-emerald-700">+</button>
                    </div>
                </div>

                <!-- Personal Shot Tracking Section -->
                <div id="personal-shots-section" class="space-y-2">
                    <h3 class="text-xs font-bold text-gold-400 uppercase">Personal Shots Used This Hole</h3>
                    <div id="player-shots-list" class="space-y-2"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const COURSE_DATABASE = {
            kinderhook: {
                name: "Olde Kinderhook Golf Club",
                holes: [
                    { hole: 1, par: 4, yards: 375 }, { hole: 2, par: 5, yards: 495 }, { hole: 3, par: 3, yards: 160 },
                    { hole: 4, par: 4, yards: 385 }, { hole: 5, par: 4, yards: 360 }, { hole: 6, par: 3, yards: 175 },
                    { hole: 7, par: 4, yards: 405 }, { hole: 8, par: 5, yards: 510 }, { hole: 9, par: 4, yards: 350 },
                    { hole: 10, par: 4, yards: 390 }, { hole: 11, par: 3, yards: 155 }, { hole: 12, par: 5, yards: 520 },
                    { hole: 13, par: 4, yards: 370 }, { hole: 14, par: 4, yards: 415 }, { hole: 15, par: 3, yards: 165 },
                    { hole: 16, par: 4, yards: 380 }, { hole: 17, par: 5, yards: 505 }, { hole: 18, par: 4, yards: 425 }
                ]
            },
            hartford: {
                name: "Hartford Greens Country Club",
                holes: [
                    { hole: 1, par: 4, yards: 365 }, { hole: 2, par: 5, yards: 485 }, { hole: 3, par: 3, yards: 150 },
                    { hole: 4, par: 4, yards: 375 }, { hole: 5, par: 4, yards: 350 }, { hole: 6, par: 3, yards: 160 },
                    { hole: 7, par: 4, yards: 390 }, { hole: 8, par: 5, yards: 500 }, { hole: 9, par: 4, yards: 340 },
                    { hole: 10, par: 4, yards: 380 }, { hole: 11, par: 3, yards: 145 }, { hole: 12, par: 5, yards: 510 },
                    { hole: 13, par: 4, yards: 360 }, { hole: 14, par: 4, yards: 400 }, { hole: 15, par: 3, yards: 155 },
                    { hole: 16, par: 4, yards: 370 }, { hole: 17, par: 5, yards: 495 }, { hole: 18, par: 4, yards: 410 }
                ]
            },
            topoftheworld: {
                name: "Top of the World Golf Resort",
                holes: [
                    { hole: 1, par: 4, yards: 350 }, { hole: 2, par: 4, yards: 360 }, { hole: 3, par: 3, yards: 145 },
                    { hole: 4, par: 5, yards: 480 }, { hole: 5, par: 4, yards: 340 }, { hole: 6, par: 3, yards: 155 },
                    { hole: 7, par: 4, yards: 375 }, { hole: 8, par: 5, yards: 490 }, { hole: 9, par: 4, yards: 330 },
                    { hole: 10, par: 4, yards: 365 }, { hole: 11, par: 3, yards: 140 }, { hole: 12, par: 5, yards: 500 },
                    { hole: 13, par: 4, yards: 350 }, { hole: 14, par: 4, yards: 385 }, { hole: 15, par: 3, yards: 160 },
                    { hole: 16, par: 4, yards: 360 }, { hole: 17, par: 5, yards: 485 }, { hole: 18, par: 4, yards: 395 }
                ]
            },
            saratogalake: {
                name: "Saratoga Lake Golf Club",
                holes: [
                    { hole: 1, par: 4, yards: 370 }, { hole: 2, par: 5, yards: 490 }, { hole: 3, par: 3, yards: 155 },
                    { hole: 4, par: 4, yards: 380 }, { hole: 5, par: 4, yards: 355 }, { hole: 6, par: 3, yards: 170 },
                    { hole: 7, par: 4, yards: 400 }, { hole: 8, par: 5, yards: 505 }, { hole: 9, par: 4, yards: 345 },
                    { hole: 10, par: 4, yards: 385 }, { hole: 11, par: 3, yards: 150 }, { hole: 12, par: 5, yards: 515 },
                    { hole: 13, par: 4, yards: 365 }, { hole: 14, par: 4, yards: 405 }, { hole: 15, par: 3, yards: 160 },
                    { hole: 16, par: 4, yards: 375 }, { hole: 17, par: 5, yards: 500 }, { hole: 18, par: 4, yards: 420 }
                ]
            }
        };

        const STORAGE_KEY = 'FLYNN_INVITATIONAL_2026_STATE';
        const firebaseConfig = {
            apiKey: "AIzaSyAgrl9R0YF5XHyjzsoN5iJQQwiMpyl49Ug",
            authDomain: "flynn-invitational.firebaseapp.com",
            databaseURL: "https://flynn-invitational-default-rtdb.firebaseio.com",
            projectId: "flynn-invitational",
            storageBucket: "flynn-invitational.firebasestorage.app",
            messagingSenderId: "394140283598",
            appId: "1:394140283598:web:3268b04be314aeb608d69f"
        };

        let db = null, dbRef = null, firebaseReady = false;
        try { if (firebaseConfig.apiKey) { firebase.initializeApp(firebaseConfig); db = firebase.database(); firebaseReady = true; } } catch (e) {}

        function getRoomCodeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return (params.get('room') || 'FLYNN26').toUpperCase();
        }

        const roomCode = getRoomCodeFromURL();
        let activeHoleIdx = 0;
        let activeTeamIdx = 0;

        function updateNavLinks() {
            document.getElementById('nav-leaderboard').href = `index.html?room=${roomCode}`;
            document.getElementById('nav-scorecard').href = `scorecard.html?room=${roomCode}`;
            document.getElementById('nav-setup').href = `setup.html?room=${roomCode}`;
            document.getElementById('room-code-badge').textContent = `ROOM: ${roomCode}`;
        }

        function loadLocalState() {
            try {
                const saved = localStorage.getItem(`${STORAGE_KEY}_${roomCode}`);
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return {
                roomCode: roomCode,
                selectedCourseKey: "kinderhook",
                customCourseName: "",
                holeCount: "18",
                nineSelection: "front",
                trackGroupScore: true,
                trackPersonalShots: true,
                teams: [
                    { name: "Team 1", players: ["Player 1", "Player 2"], holes: [] },
                    { name: "Team 2", players: ["Player 3", "Player 4"], holes: [] }
                ]
            };
        }

        let localState = loadLocalState();

        function generateCustomCourseHoles(count) {
            const holes = [];
            for (let i = 1; i <= count; i++) {
                holes.push({ hole: i, par: 4, yards: 350 });
            }
            return holes;
        }

        function getActiveCourseHoles() {
            let fullCourse;
            if (localState.selectedCourseKey === 'custom') {
                fullCourse = generateCustomCourseHoles(18);
            } else {
                fullCourse = COURSE_DATABASE[localState.selectedCourseKey || 'kinderhook'].holes;
            }
            const count = parseInt(localState.holeCount || "18", 10);
            if (count === 18) return fullCourse;
            if (count === 9) {
                return localState.nineSelection === 'back' ? fullCourse.slice(9, 18) : fullCourse.slice(0, 9);
            }
            if (count === 6) return fullCourse.slice(0, 6);
            return fullCourse;
        }

        function syncToFirebaseAndLocal() {
            localStorage.setItem(`${STORAGE_KEY}_${roomCode}`, JSON.stringify(localState));
            if (firebaseReady && db) {
                db.ref('rooms/' + roomCode).set(localState);
            }
        }

        function connectToRoom() {
            if (!firebaseReady) return;
            dbRef = db.ref('rooms/' + roomCode);
            dbRef.on('value', (snapshot) => {
                const remoteState = snapshot.val();
                if (remoteState && Array.isArray(remoteState.teams)) {
                    localState = remoteState;
                    localStorage.setItem(`${STORAGE_KEY}_${roomCode}`, JSON.stringify(localState));
                    renderUI();
                }
            });
        }

        function formatScoreBadge(score, par) {
            if (!score || score === 0) return `<span class="text-emerald-700 font-bold">-</span>`;
            const diff = score - par;
            if (diff <= -2) return `<span class="golf-score-eagle">${score}</span>`;
            if (diff === -1) return `<span class="golf-score-birdie">${score}</span>`;
            if (diff === 0) return `<span class="golf-score-par">${score}</span>`;
            if (diff === 1) return `<span class="golf-score-bogey">${score}</span>`;
            return `<span class="golf-score-doublebogey">${score}</span>`;
        }

        function renderScorecardGrid() {
            const activeHoles = getActiveCourseHoles();
            const headerRow = document.getElementById('scorecard-grid-header-holes');
            const parRow = document.getElementById('scorecard-grid-pars');
            const teamsBody = document.getElementById('scorecard-grid-team-scores');

            headerRow.innerHTML = activeHoles.map(h => `<th class="p-1 border-r border-emerald-800/60 w-8">${h.hole}</th>`).join('');
            parRow.innerHTML = activeHoles.map(h => `<td class="p-1 border-r border-emerald-800/60">${h.par}</td>`).join('');
            
            const totalPar = activeHoles.reduce((sum, h) => sum + h.par, 0);
            document.getElementById('scorecard-grid-total-par').textContent = totalPar;

            teamsBody.innerHTML = '';

            (localState.teams || []).forEach((team, tIdx) => {
                const isCurrentTeam = tIdx === activeTeamIdx;
                let rowHtml = `<tr class="${isCurrentTeam ? 'bg-gold-500/10 font-bold' : ''} border-b border-emerald-800/40">`;
                rowHtml += `<td class="p-2 border-r border-emerald-800 text-left font-serif text-white sticky left-0 ${isCurrentTeam ? 'bg-emerald-900 text-gold-400 font-bold' : 'bg-emerald-950'} z-10 text-[11px] truncate max-w-[80px]">${team.name}</td>`;

                let teamTotalStrokes = 0;
                activeHoles.forEach((h, hIdx) => {
                    const holeData = team.holes ? team.holes[hIdx] : null;
                    const score = holeData && holeData.completed ? holeData.score : 0;
                    if (score > 0) teamTotalStrokes += score;

                    const formattedBadge = holeData && holeData.completed ? formatScoreBadge(score, h.par) : `<span class="text-emerald-800">-</span>`;
                    rowHtml += `<td class="p-1 border-r border-emerald-800/60">${formattedBadge}</td>`;
                });

                rowHtml += `<td class="p-1 border-l border-emerald-800 font-bold ${isCurrentTeam ? 'text-gold-400' : 'text-emerald-200'}">${teamTotalStrokes || '-'}</td></tr>`;
                teamsBody.innerHTML += rowHtml;
            });
        }

        function calculateTeamTotal(team) {
            if (!team || !team.holes) return "E";
            const activeHoles = getActiveCourseHoles();
            const playedHoles = team.holes.filter(h => h && h.completed);
            if (playedHoles.length === 0) return "E";

            let totalStrokes = 0;
            let totalPar = 0;

            team.holes.forEach((h, idx) => {
                if (h && h.completed) {
                    totalStrokes += (h.score || 0);
                    totalPar += (activeHoles[idx] ? activeHoles[idx].par : 0);
                }
            });

            const diff = totalStrokes - totalPar;
            return diff > 0 ? `+${diff}` : (diff === 0 ? "E" : `${diff}`);
        }

        function renderPills() {
            const container = document.getElementById('hole-pills-container');
            container.innerHTML = '';
            const activeHoles = getActiveCourseHoles();
            const team = localState.teams[activeTeamIdx];

            activeHoles.forEach((h, idx) => {
                const holeData = team && team.holes ? team.holes[idx] : null;
                const isCompleted = holeData && holeData.completed;
                const isActive = idx === activeHoleIdx;

                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-8 h-8 rounded-lg text-xs font-bold transition-all flex items-center justify-center ${
                    isActive 
                        ? 'bg-gold-500 text-emerald-950 shadow-md ring-2 ring-gold-400' 
                        : isCompleted 
                            ? 'bg-emerald-800 text-gold-400 border border-emerald-600' 
                            : 'bg-emerald-950 text-emerald-400 border border-emerald-850'
                }`;
                btn.textContent = h.hole;
                btn.onclick = () => { activeHoleIdx = idx; renderUI(); };
                container.appendChild(btn);
            });
        }

        function renderUI() {
            const teamSelect = document.getElementById('scorecard-team-select');
            if (localState.teams && localState.teams.length > 0) {
                teamSelect.innerHTML = localState.teams.map((t, idx) => `<option value="${idx}" ${idx === activeTeamIdx ? 'selected' : ''}>${t.name}</option>`).join('');
            } else {
                teamSelect.innerHTML = `<option>No teams</option>`;
                return;
            }

            const activeHoles = getActiveCourseHoles();
            if (activeHoleIdx >= activeHoles.length) activeHoleIdx = 0;

            const courseName = localState.selectedCourseKey === 'custom' 
                ? (localState.customCourseName || "Custom Course") 
                : COURSE_DATABASE[localState.selectedCourseKey || 'kinderhook'].name;

            document.getElementById('course-name-display').textContent = courseName;

            const team = localState.teams[activeTeamIdx];
            if (!team.holes || team.holes.length !== activeHoles.length) {
                team.holes = activeHoles.map(() => ({ score: 0, playerShots: Array((team.players || []).length).fill(0), completed: false }));
            }

            const currentHole = activeHoles[activeHoleIdx];
            const holeData = team.holes[activeHoleIdx] || { score: 0, playerShots: [], completed: false };

            document.getElementById('current-hole-heading').textContent = `Hole ${currentHole.hole} (${activeHoleIdx + 1} of ${activeHoles.length})`;
            document.getElementById('card-hole-title').textContent = `Hole ${currentHole.hole}`;
            document.getElementById('card-hole-par').textContent = currentHole.par;
            document.getElementById('card-hole-yards').textContent = currentHole.yards;
            document.getElementById('current-hole-score-display').textContent = holeData.score || 0;
            document.getElementById('scorecard-team-total').textContent = calculateTeamTotal(team);

            // Group score tracking UI controls
            const isGroupTracked = localState.trackGroupScore !== false;
            const btnMinus = document.getElementById('btn-score-minus');
            const btnPlus = document.getElementById('btn-score-plus');

            if (!isGroupTracked) {
                btnMinus.style.display = 'none';
                btnPlus.style.display = 'none';
                document.getElementById('team-score-subtitle').textContent = "Auto-calculated from personal shots";
            } else {
                btnMinus.style.display = 'flex';
                btnPlus.style.display = 'flex';
                document.getElementById('team-score-subtitle').textContent = "Total team strokes taken";
            }

            // Personal shot tracking UI section visibility
            const isPersonalTracked = localState.trackPersonalShots !== false;
            const personalSection = document.getElementById('personal-shots-section');
            if (!isPersonalTracked) {
                personalSection.style.display = 'none';
            } else {
                personalSection.style.display = 'block';
                const playerShotsContainer = document.getElementById('player-shots-list');
                playerShotsContainer.innerHTML = '';
                (team.players || []).forEach((pName, pIdx) => {
                    if (!pName) return;
                    const count = (holeData.playerShots && holeData.playerShots[pIdx]) || 0;
                    const row = document.createElement('div');
                    row.className = "bg-emerald-900/60 p-2.5 rounded-xl border border-emerald-800 flex items-center justify-between";
                    row.innerHTML = `
                        <span class="text-xs font-semibold text-white">${pName}</span>
                        <div class="flex items-center gap-2">
                            <button onclick="adjustPlayerShot(${pIdx}, -1)" class="w-8 h-8 rounded-lg bg-emerald-950 text-emerald-200 font-bold flex items-center justify-center border border-emerald-700">-</button>
                            <span class="font-bold text-sm text-gold-400 w-5 text-center">${count}</span>
                            <button onclick="adjustPlayerShot(${pIdx}, 1)" class="w-8 h-8 rounded-lg bg-emerald-950 text-emerald-200 font-bold flex items-center justify-center border border-emerald-700">+</button>
                        </div>
                    `;
                    playerShotsContainer.appendChild(row);
                });
            }

            renderScorecardGrid();
            renderPills();
        }

        window.adjustPlayerShot = function(pIdx, delta) {
            const team = localState.teams[activeTeamIdx];
            if (!team.holes[activeHoleIdx].playerShots) {
                team.holes[activeHoleIdx].playerShots = Array(team.players.length).fill(0);
            }
            team.holes[activeHoleIdx].playerShots[pIdx] = Math.max(0, (team.holes[activeHoleIdx].playerShots[pIdx] || 0) + delta);
            team.holes[activeHoleIdx].completed = true;

            // If team score tracking is OFF, auto-calculate team score from sum of personal shots
            if (localState.trackGroupScore === false) {
                const totalPersonal = team.holes[activeHoleIdx].playerShots.reduce((a, b) => a + b, 0);
                team.holes[activeHoleIdx].score = totalPersonal;
            }

            syncToFirebaseAndLocal();
            renderUI();
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateNavLinks();
            renderUI();
            connectToRoom();
            lucide.createIcons();

            document.getElementById('btn-score-minus').onclick = () => {
                if (localState.trackGroupScore === false) return;
                const team = localState.teams[activeTeamIdx];
                team.holes[activeHoleIdx].score = Math.max(0, team.holes[activeHoleIdx].score - 1);
                team.holes[activeHoleIdx].completed = true;
                syncToFirebaseAndLocal();
                renderUI();
            };

            document.getElementById('btn-score-plus').onclick = () => {
                if (localState.trackGroupScore === false) return;
                const team = localState.teams[activeTeamIdx];
                team.holes[activeHoleIdx].score += 1;
                team.holes[activeHoleIdx].completed = true;
                syncToFirebaseAndLocal();
                renderUI();
            };

            document.getElementById('scorecard-team-select').onchange = (e) => {
                activeTeamIdx = parseInt(e.target.value, 10);
                renderUI();
            };

            document.getElementById('btn-prev-hole').onclick = () => { if (activeHoleIdx > 0) { activeHoleIdx--; renderUI(); } };
            document.getElementById('btn-next-hole').onclick = () => {
                const max = getActiveCourseHoles().length - 1;
                if (activeHoleIdx < max) { activeHoleIdx++; renderUI(); }
            };
        });
    </script>
</body>
</html>

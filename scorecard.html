<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quail Invitational - Scorecard & Input</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <h1>Quail Invitational</h1>
    <nav>
      <a href="index.html">Leaderboard</a>
      <a href="scorecard.html" class="active">Scorecard</a>
      <a href="setup.html">Setup</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Hole-by-Hole Scorecard</h2>
      <div class="team-selector">
        <label for="scorecard-team-select"><strong>Select Team:</strong></label>
        <select id="scorecard-team-select" onchange="loadTeamScorecard(this.value)">
          <option value="team1">Team 1</option>
          <option value="team2">Team 2</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table class="scorecard-table">
          <thead>
            <tr>
              <th>Hole</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
              <th>OUT</th>
              <th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th>
              <th>IN</th>
              <th>TOT</th>
            </tr>
            <tr class="par-row">
              <th>Par</th>
              <td>4</td><td>4</td><td>3</td><td>5</td><td>4</td><td>3</td><td>4</td><td>4</td><td>5</td>
              <td>36</td>
              <td>4</td><td>3</td><td>5</td><td>4</td><td>4</td><td>3</td><td>4</td><td>5</td><td>4</td>
              <td>36</td>
              <td>72</td>
            </tr>
          </thead>
          <tbody id="scorecard-inputs">
            <!-- Score input cells generated by JS -->
          </tbody>
        </table>
      </div>

      <div class="card-actions">
        <button id="save-scorecard-btn" class="btn-primary" onclick="saveScorecard()">Save & Sync Scores</button>
      </div>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initScorecardView();
    });
  </script>
</body>
</html>

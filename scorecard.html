<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quail Invitational - Scorecard</title>
  <style>
    :root {
      --bg-dark: #0b101b;
      --card-bg: #131b2e;
      --accent-orange: #ff6b4a;
      --border-color: #273552;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .room-badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: var(--accent-orange);
      margin-top: 5px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      background: #0f172a;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .nav-tab.active {
      background: var(--accent-orange);
      color: #ffffff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .scoring-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-select {
      background: #0d1424;
      border: 1px solid var(--border-color);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-family: serif;
    }

    .total-score-box {
      text-align: right;
    }

    .total-score {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-orange);
      margin: 0;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      min-width: 700px;
    }

    th, td {
      padding: 10px 6px;
      border: 1px solid var(--border-color);
    }

    th {
      background: #0d1424;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .score-circle {
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      border-radius: 50%;
      border: 1px solid var(--accent-orange);
      color: var(--accent-orange);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="margin: 0; font-family: serif; letter-spacing: 1px;">QUAIL INVITATIONAL</h1>
    <div class="room-badge">ROOM: QUAIL26</div>
  </div>

  <nav class="nav-tabs">
    <a href="leaderboard.html" class="nav-tab">🏆 Leaderboard</a>
    <a href="scorecard.html" class="nav-tab active">✏️ Scorecard</a>
    <a href="setup.html" class="nav-tab">⚙️ Setup</a>
  </nav>

  <!-- Scoring Selector Section -->
  <div class="card">
    <div class="scoring-header">
      <div>
        <div style="font-size: 0.75rem; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;">Scoring For Team</div>
        <select class="team-select" id="teamSelect">
          <option value="Team 1">Team 1</option>
          <option value="Team 2">Team 2</option>
        </select>
      </div>
      <div class="total-score-box">
        <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Total Score</div>
        <div class="total-score">-1</div>
      </div>
    </div>
  </div>

  <!-- Scorecard Table -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-size: 0.85rem; color: var(--accent-orange); letter-spacing: 1px; font-weight: bold;">田 FULL COURSE SCORECARD GRID</span>
      <span style="font-size: 0.8rem; color: var(--text-muted);">Scroll horizontally →</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>HOLE</th>
            <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
            <th>OUT</th>
            <th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th>
            <th>IN</th>
            <th>TOT</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Par</strong></td>
            <td>4</td><td>4</td><td>4</td><td>3</td><td>5</td><td>3</td><td>5</td><td>4</td><td>4</td>
            <td><strong>36</strong></td>
            <td>4</td><td>3</td><td>4</td><td>4</td><td>4</td><td>4</td><td>5</td><td>3</td><td>4</td>
            <td><strong>35</strong></td>
            <td><strong>71</strong></td>
          </tr>
          <tr>
            <td><strong>Team 1</strong></td>
            <td>4</td><td><span class="score-circle">3</span></td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
            <td><strong>7</strong></td>
            <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
            <td><strong>0</strong></td>
            <td><strong>7</strong></td>
          </tr>
          <tr>
            <td><strong>Team 2</strong></td>
            <td><span class="score-circle">2</span></td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
            <td><strong>2</strong></td>
            <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
            <td><strong>0</strong></td>
            <td><strong>2</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>

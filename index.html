<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quail Invitational - Live Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <h1>Quail Invitational</h1>
    <nav>
      <a href="index.html" class="active">Leaderboard</a>
      <a href="scorecard.html">Scorecard</a>
      <a href="setup.html">Setup</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Live Leaderboard</h2>
      <p class="subtitle">Quail Hollow Golf Course — Oakham, MA</p>
      
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Team</th>
            <th>Thru</th>
            <th>Total Score</th>
            <th>To Par</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="5" style="text-align:center;">Loading scores...</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="card" style="margin-top: 2rem;">
      <h2>MVP / Shot Contribution Highlights</h2>
      <div id="mvp-highlights" class="mvp-grid">
        <p>Loading shot tracking summary...</p>
      </div>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initLeaderboard();
    });
  </script>
</body>
</html>

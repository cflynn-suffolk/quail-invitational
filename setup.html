<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quail Invitational - Setup</title>
  <style>
    :root {
      --bg-dark: #0b101b;
      --card-bg: #131b2e;
      --accent-orange: #ff6b4a;
      --border-color: #273552;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .room-badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: var(--accent-orange);
      margin-top: 5px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      background: #0f172a;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .nav-tab.active {
      background: var(--accent-orange);
      color: #ffffff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-orange);
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background: #0d1424;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent-orange);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-orange);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="margin: 0; font-family: serif; letter-spacing: 1px;">QUAIL INVITATIONAL</h1>
    <div class="room-badge">ROOM: QUAIL26</div>
  </div>

  <nav class="nav-tabs">
    <a href="leaderboard.html" class="nav-tab">🏆 Leaderboard</a>
    <a href="scorecard.html" class="nav-tab">✏️ Scorecard</a>
    <a href="setup.html" class="nav-tab active">⚙️ Setup</a>
  </nav>

  <!-- MOVED: Active Tee Selection section now resides in Setup -->
  <div class="card">
    <h2 class="card-title">⛳ Course & Tee Settings</h2>
    <div class="form-group">
      <label for="teeSelect">Active Tee Box</label>
      <select id="teeSelect" onchange="updateTeePreference(this.value)">
        <option value="blue" selected>Blue Tees (5,719 yds)</option>
        <option value="white">White Tees (5,439 yds)</option>
        <option value="gold">Gold Tees (4,956 yds)</option>
        <option value="red">Red Tees (4,361 yds)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">👥 Team & Player Configuration</h2>
    <div class="form-group">
      <label for="teamName">Team Selection / Name</label>
      <input type="text" id="teamName" value="Team 1" placeholder="Enter team name" />
    </div>
    <button class="btn" onclick="saveSettings()">Save Configuration</button>
  </div>
</div>

<script>
  // Load saved tee configuration on load
  document.addEventListener("DOMContentLoaded", () => {
    const savedTee = localStorage.getItem("quail_active_tee") || "blue";
    document.getElementById("teeSelect").value = savedTee;
  });

  function updateTeePreference(tee) {
    localStorage.setItem("quail_active_tee", tee);
  }

  function saveSettings() {
    const team = document.getElementById("teamName").value;
    localStorage.setItem("quail_active_team", team);
    alert("Setup configurations saved!");
  }
</script>

</body>
</html>

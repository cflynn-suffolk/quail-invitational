<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quail Invitational - Tournament Setup</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <h1>Quail Invitational</h1>
    <nav>
      <a href="index.html">Leaderboard</a>
      <a href="scorecard.html">Scorecard</a>
      <a href="setup.html" class="active">Setup</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Tournament Setup & Rosters</h2>
      <form id="setup-form" onsubmit="handleSetupSubmit(event)">
        <div class="form-group">
          <label for="tournament-name">Tournament Name</label>
          <input type="text" id="tournament-name" value="Quail Invitational" required>
        </div>

        <h3>Team Configurations</h3>
        <div class="team-setup-grid">
          <div class="team-card">
            <h4>Team 1</h4>
            <input type="text" id="team1-name" value="Team 1" placeholder="Team Name">
            <label>Player 1:</label>
            <input type="text" class="team1-player" placeholder="Player Name">
            <label>Player 2:</label>
            <input type="text" class="team1-player" placeholder="Player Name">
            <label>Player 3:</label>
            <input type="text" class="team1-player" placeholder="Player Name">
            <label>Player 4:</label>
            <input type="text" class="team1-player" placeholder="Player Name">
          </div>

          <div class="team-card">
            <h4>Team 2</h4>
            <input type="text" id="team2-name" value="Team 2" placeholder="Team Name">
            <label>Player 1:</label>
            <input type="text" class="team2-player" placeholder="Player Name">
            <label>Player 2:</label>
            <input type="text" class="team2-player" placeholder="Player Name">
            <label>Player 3:</label>
            <input type="text" class="team2-player" placeholder="Player Name">
            <label>Player 4:</label>
            <input type="text" class="team2-player" placeholder="Player Name">
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">Save Setup</button>
      </form>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
